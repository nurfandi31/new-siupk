services:
  app:
    build:
      context: .
      args:
        UID: 
        GID: 
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      PLATFORM_DB_HOST: mysql
      TENANT_DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_CLIENT: predis
      RAG_DB_CONNECTION: pgsql
      RAG_DB_HOST: postgres
      RAG_DB_PORT: 5432
      RAG_DB_DATABASE: ${RAG_DB_DATABASE:-assistant}
      RAG_DB_USERNAME: ${RAG_DB_USERNAME:-assistant}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-assistant}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  queue:
    build:
      context: .
      args:
        UID: 
        GID: 
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work redis --tries=3 --timeout=90
    environment:
      APP_ENV: local
      PLATFORM_DB_HOST: mysql
      TENANT_DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_CLIENT: predis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - web-network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    # Security: bind hanya ke localhost. Published port Docker bypass firewalld;
    # port ini pernah dipakai penyerang (insiden 2026-09-02, database wipe).
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      PLATFORM_DB_USERNAME: ${PLATFORM_DB_USERNAME:-root}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-}
      PLATFORM_DB_DATABASE: ${PLATFORM_DB_DATABASE:-siupk_platform}
      TENANT_DB_DATABASE: ${TENANT_DB_DATABASE:-siupk_shard_local}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${RAG_DB_DATABASE:-assistant}
      POSTGRES_USER: ${RAG_DB_USERNAME:-assistant}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-assistant}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_DB_USERNAME:-assistant} -d ${RAG_DB_DATABASE:-assistant}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Ollama..."
        MODEL="${EMBEDDING_MODEL:-nomic-embed-text}"
        echo "Pulling $$MODEL..."
        OLLAMA_HOST=http://ollama:11434 ollama pull "$$MODEL"
        echo "Model ready."
    restart: "no"

networks:
  web-network:
    external: true

volumes:
  mysql-data:
  redis-data:
  pg-data:
  ollama-data: