name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Lint, Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, mbstring, intl, bcmath, gd, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ENPII_ASSISTANT_PAT || secrets.GH_PAT || secrets.PACKAGE_PAT || secrets.COMPOSER_AUTH_TOKEN || secrets.GITHUB_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Create SQLite Test Databases
        run: |
          mkdir -p database
          touch database/platform_test.sqlite
          touch database/tenant_test.sqlite

      - name: Check Code Style (Pint)
        run: vendor/bin/pint --test

      - name: Run PHPUnit Tests
        run: php artisan test

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 15m
          script: |
            set -e
            TARGET_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$TARGET_PATH" ]; then
              TARGET_PATH="/home/enpii/new_siupk"
            fi
            
            echo "Deploying to $TARGET_PATH..."
            cd "$TARGET_PATH"
            
            OLD_HEAD=$(git rev-parse HEAD 2>/dev/null || echo "")
            
            echo "Pulling latest code from Git..."
            git pull origin main
            
            NEEDS_BUILD=false
            if [ -n "$OLD_HEAD" ]; then
              if git diff --name-only "$OLD_HEAD" HEAD | grep -qE '^(Dockerfile|docker-compose\.yml|docker/)'; then
                NEEDS_BUILD=true
              fi
            fi
            
            if [ "$NEEDS_BUILD" = "true" ]; then
              echo "Docker configuration changes detected! Rebuilding images..."
              docker compose up -d --build
            else
              echo "Ensuring Docker containers are running..."
              docker compose up -d
            fi
            
            echo "Installing Composer dependencies on server..."
            PAT_TOKEN="${{ secrets.ENPII_ASSISTANT_PAT || secrets.GH_PAT }}"
            if [ -n "$PAT_TOKEN" ]; then
              docker compose exec -T -e COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$PAT_TOKEN\"}}" app composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            else
              docker compose exec -T app composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            fi

            echo "Building Vite frontend assets on server..."
            if command -v npm >/dev/null 2>&1; then
              npm ci --prefer-offline --no-audit
              npm run build
            else
              docker run --rm -v "$(pwd)":/app -w /app node:22-alpine sh -c "npm ci && npm run build"
            fi
            
            echo "Running platform migrations..."
            docker compose exec -T app php artisan migrate --database=platform --path=database/migrations/platform --force
            
            echo "Running tenant shard migrations..."
            docker compose exec -T app php artisan tenancy:migrate-shards --force
            
            echo "Running assistant RAG database migrations..."
            docker compose exec -T app php artisan migrate --database=rag --path=vendor/enpii/assistant/database/migrations --force || true

            echo "Ensuring public storage symlink is connected..."
            docker compose exec -T app php artisan storage:link || true
            
            echo "Refreshing & optimizing Laravel caches..."
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan route:clear
            docker compose exec -T app php artisan view:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            
            echo "Restarting PHP FPM and queue worker containers..."
            docker compose restart app queue

            echo "Deployment completed successfully!"