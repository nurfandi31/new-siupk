name: siupk_mobile
description: "siupk Mobile App - Companion Operasional Lapangan & Eksekutif untuk siupk Next"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.7

  # Networking & Serialization
  dio: ^5.4.1
  intl: ^0.19.0

  # Storage & Offline
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI Components & Icons
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  lucide_icons: ^0.257.0

  # Hardware & Mobile Features
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  geolocator: ^11.0.0
  signature: ^5.4.1
  blue_thermal_printer: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
